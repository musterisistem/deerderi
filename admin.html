<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEER DERİ | Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="product-form.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>

<body>
    <!-- Login Screen -->
    <div class="admin-login-wrapper" id="admin-login-wrapper">
        <div class="admin-login-card">
            <img src="assets/logo.png" alt="DEER DERİ" class="admin-login-logo">
            <h2>Yönetim Paneli Girişi</h2>
            <p>Devam etmek için lütfen giriş yapın.</p>
            <form id="admin-login-form">
                <div class="login-input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="admin-username" placeholder="Kullanıcı Adı" required autocomplete="off">
                </div>
                <div class="login-input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="admin-password" placeholder="Şifre" required autocomplete="off">
                </div>
                <div id="admin-login-error" class="admin-login-error" style="display:none;">Hatalı kullanıcı adı veya şifre!</div>
                <button type="submit" class="btn-admin-login">Giriş Yap</button>
            </form>
        </div>
    </div>

    <div class="admin-layout" id="admin-layout" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="assets/logo.png" alt="DEER DERİ" class="admin-logo">
                <h3>YÖNETİM</h3>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-group">
                    <a href="#" class="nav-link nav-parent" onclick="toggleSubmenu(event, 'settings-submenu')">
                        <i class="fa-solid fa-gear"></i> Ayarlar
                        <i class="fa-solid fa-chevron-down submenu-arrow"></i>
                    </a>
                    <div class="nav-submenu" id="settings-submenu">
                        <a href="#" class="nav-link nav-sublink" data-view="campaigns">
                            <i class="fa-solid fa-bullhorn"></i> Kayan Kampanyalar
                        </a>
                        <a href="#" class="nav-link nav-sublink" data-view="logo-settings">
                            <i class="fa-solid fa-image"></i> Site Logosu
                        </a>
                        <a href="#" class="nav-link nav-sublink" data-view="menu-settings">
                            <i class="fa-solid fa-list"></i> Site Menüsü
                        </a>
                    </div>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <i class="fa-solid fa-circle-user"></i>
                    <span>Admin</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="topbar-search">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" placeholder="Search">
                    <span class="topbar-search-kbd">⌘ F</span>
                </div>
                <div class="topbar-right">
                    <a href="#" class="topbar-help"><i class="fa-regular fa-circle-question"></i> Help Center</a>
                    <div class="topbar-profile">
                        <img src="https://i.pravatar.cc/150?img=11" alt="Profile">
                        <span>Admin <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 5px;"></i></span>
                    </div>
                    <button id="admin-logout-btn" class="btn btn-delete" style="margin-left: 15px;"><i class="fa-solid fa-sign-out-alt"></i> Çıkış Yap</button>
                </div>
            </header>
            
            <div class="page-title-nexa" style="padding: 15px 15px 0; display: flex; justify-content: space-between; align-items: center;">
                <h2 id="view-title" style="font-size: 20px; color: var(--text-dark); margin: 0;">Dashboard</h2>
                <div>
                    <button class="btn btn-primary" id="add-item-btn" style="display: none;">
                        <i class="fa-solid fa-plus"></i> <span id="add-btn-text">Ekle</span>
                    </button>
                </div>
            </div>

            <div id="content-area" class="content-area">
                <!-- Dynamic Content Injected Here -->
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Ekle/Düzenle</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body" id="modal-form-area">
                <!-- Dynamic Form Injected Here -->
            </div>
        </div>
    </div>

    <!-- Icon Select Modal -->
    <div id="icon-modal" class="modal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h3>İkon Seç</h3>
                <span class="close-icon-modal close-modal" style="cursor:pointer; font-size:20px;">&times;</span>
            </div>
            <div class="modal-body">
                <input type="text" id="icon-search" class="form-control" placeholder="İkon ara..." style="margin-bottom: 15px;">
                <div id="icon-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; max-height: 400px; overflow-y: auto; padding: 10px; background: #f9f9f9; border-radius: 5px; border: 1px solid #ddd;">
                    <!-- Icons will be loaded here -->
                    <div style="grid-column: 1/-1; text-align: center; padding: 20px;"><i class="fa-solid fa-spinner fa-spin"></i> İkonlar yükleniyor...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="admin_email_settings.js"></script>
    <script src="admin.js?v=109"></script>
</body>

</html>
